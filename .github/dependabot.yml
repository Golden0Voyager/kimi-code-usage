version: 2

# Dependabot version updates are intentionally DISABLED.
#
# `open-pull-requests-limit: 0` is the documented switch for turning scheduled
# update PRs off without deleting the configuration. Security updates travel a
# separate channel and are also turned off in this repository's settings, so no
# dependency PR appears here unless someone asks for one.
#
# Why: the first week of this file produced seven PRs at once — a full backlog
# scan plus one PR per major (vitest, @vitest/ui, @types/node, checkout,
# setup-uv, setup-node). Two of them could not pass alone at all. Dependency
# work is applied deliberately instead, with the audit gate in ci.yml still
# failing on any known advisory.
#
# To resume automatic updates, raise each limit below from 0 to 5. The grouping
# rules are kept so the reasoning survives:
#   - minors and patches group per ecosystem, because they share a lockfile;
#   - majors stay separate, because they need their own smoke (fastmcp/mcp);
#   - vitest majors group together, because `@vitest/ui` pins the exact
#     `vitest` peer and a split proposal can never satisfy `npm ci`.

updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 0
    commit-message:
      prefix: "chore(deps)"
    groups:
      python-minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: "npm"
    directory: "/vscode-extension"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 0
    commit-message:
      prefix: "chore(deps)"
    groups:
      extension-minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      extension-vitest-major:
        patterns: ["vitest", "@vitest/*"]
        update-types: ["major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 0
    commit-message:
      prefix: "ci(deps)"
