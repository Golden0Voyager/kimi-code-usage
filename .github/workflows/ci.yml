name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --dev

      - name: Run ruff check
        run: uv run ruff check src/

      - name: Run mypy
        run: uv run mypy src/ || true
      - name: Run security scan (bandit)
        run: uv tool run bandit -r src/ || true

      - name: Run dependency audit
        # `uv audit` does not exist (uv 0.9.17), so the old step audited nothing.
        # pip-audit reads the same frozen lock, needs no virtualenv, and fails
        # the job on a known advisory.
        run: |
          uv export --frozen --no-emit-project --format requirements-txt --no-hashes > "$RUNNER_TEMP/requirements.txt"
          uvx pip-audit@2.10.1 --disable-pip --no-deps -r "$RUNNER_TEMP/requirements.txt" --progress-spinner off


      - name: Run tests with coverage
        run: uv run pytest --cov --cov-report=term-missing tests/

      - name: Enforce coverage threshold
        run: uv run coverage report
