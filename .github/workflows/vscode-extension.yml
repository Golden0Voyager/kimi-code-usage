name: VS Code Extension CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  extension:
    name: Extension typecheck, lint, format, test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: vscode-extension
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: vscode-extension/package-lock.json

      # The extension's lock file is committed, so `npm ci` is exact and never
      # runs the dependency resolver. That matters here: a *floating*
      # `npm install` under Node 22's bundled npm 10.9.x crashes inside
      # @npmcli/arborist's peer resolution with
      #   npm error Cannot read properties of null (reading 'edgesOut')
      # which is exactly how this job failed on its first ever run.
      - name: Install dependencies
        run: |
          node --version
          npm --version
          npm ci

      - name: Typecheck
        run: npm run compile

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Test
        run: npm test
