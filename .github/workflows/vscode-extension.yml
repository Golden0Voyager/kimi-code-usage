name: VS Code Extension CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  extension:
    name: Extension typecheck, lint, test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: vscode-extension
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # vscode-extension/package-lock.json is git-ignored, so `npm ci` cannot be
      # used here. Commit the lock file (and drop the ignore rule) to switch this
      # step to a reproducible `npm ci`.
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run compile

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test
