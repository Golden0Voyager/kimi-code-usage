[project]
name = "kimi-code-usage"
version = "0.1.5"
description = "A curated Kimi Coding Plan usage monitor with aesthetic CLI and MCP server."
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Haining Yu", email = "hainingyu@gmail.com" }
]
license = { text = "MIT" }
keywords = ["kimi", "moonshot", "mcp", "usage", "monitor", "curated"]
dependencies = [
    "aiohttp>=3.8.0",
    "rich>=12.0.0",
    "python-dotenv>=1.0.0",
    "fastmcp>=0.1.0",
    "httpx[socks]>=0.20.0",
]

[project.urls]
Homepage = "https://github.com/Golden0Voyager/kimi-code-usage"
Repository = "https://github.com/Golden0Voyager/kimi-code-usage"
Issues = "https://github.com/Golden0Voyager/kimi-code-usage/issues"

[project.scripts]
kimi-code-usage = "kimi_code_usage.main:run_cli"
kimi-usage = "kimi_code_usage.main:run_cli"
kimi-mcp = "kimi_code_usage.mcp:run_mcp"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kimi_code_usage"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]
ignore = ["E501", "SIM108", "SIM117", "UP035", "N806"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["N806"]

[tool.mypy]
ignore_missing_imports = true
files = ["src/kimi_code_usage/"]

[tool.coverage.run]
source = ["kimi_code_usage"]

[tool.coverage.report]
fail_under = 85
show_missing = true

[tool.bandit]
skips = ["B101", "B311", "B404", "B603"]
